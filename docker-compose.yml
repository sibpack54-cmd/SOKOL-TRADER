version: '3.8'

services:
  sokol-trader:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sokol-trader
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"